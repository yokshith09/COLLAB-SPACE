name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Build Next.js app (includes type checking)
      run: npm run build
      env:
        # Provide dummy env vars required for build, if any
        NEXT_TELEMETRY_DISABLED: 1
        DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
