name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Build Next.js app (includes type checking)
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
        DATABASE_URL: "mongodb://127.0.0.1:27017/collabspace_build"
        AUTH_SECRET: "test-build-secret-key-32-chars-long-example"
        AUTH_URL: "http://localhost:3000"
        NEXTAUTH_SECRET: "test-build-secret-key-32-chars-long-example"
        NEXTAUTH_URL: "http://localhost:3000"
